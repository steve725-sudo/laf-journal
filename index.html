<!doctype html>
<html lang="en-AU">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src blob:; manifest-src 'self'; worker-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">

<title>LAF</title>
<style>
:root{
  --bg:#F6F3EE;--surface:#FFFDFA;--ink:#2D2C2A;--muted:#7A766F;--line:#E3DDD3;
  --love:#C4848B;--accept:#86A085;--forgive:#7F98B3;--dream:#9890BC;--practice:#6F9C95;--creative:#C39A5A;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1B1C1E;--surface:#242528;--ink:#E8E4DD;--muted:#9C978F;--line:#36383C;
  --love:#D1979D;--accept:#9BB59A;--forgive:#95ADC7;--dream:#ABA3CF;--practice:#86B1AA;--creative:#D3AD70;
  color-scheme:dark;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--forgive);outline-offset:2px;border-radius:6px}
[data-acc="love"]{--c:var(--love)}[data-acc="accept"]{--c:var(--accept)}[data-acc="forgive"]{--c:var(--forgive)}

.app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 100px)}
h1{font-family:var(--serif);font-weight:400;font-size:2rem;line-height:1.15;letter-spacing:-.01em}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.label{font-size:.82rem;color:var(--muted);margin:18px 0 6px}
.small{font-size:.86rem;color:var(--muted);line-height:1.5;margin-top:10px}
.hint{color:var(--muted);font-style:italic}
.x{color:var(--muted);font-size:.95rem;padding:6px 0;white-space:nowrap}

.laf{margin:26px 0 6px;display:grid;gap:14px}
.laf .label{margin:0}
.laf.done{cursor:pointer}
.laf-row{display:grid;grid-template-columns:3px 1fr;gap:14px}
.laf-row .bar{border-radius:3px;background:var(--c)}
.laf-row p{font-family:var(--serif);font-size:1.15rem;line-height:1.5;padding:2px 0}

.primary{display:block;width:100%;padding:15px 18px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:1rem;margin-top:14px;text-align:center}
.primary:disabled{opacity:.5}
.secondary{display:block;width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);font-size:.95rem;margin-top:10px;text-align:center}
.quiet{display:block;width:100%;padding:13px;color:var(--muted);font-size:.95rem;margin-top:4px;text-align:center}
.link{color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:.95rem;padding:4px 0}

.group{font-family:var(--serif);font-weight:400;font-size:1.15rem;margin:32px 0 10px;color:var(--muted)}
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.actions button{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:.98rem}
.actions small{margin-left:auto;color:var(--muted)}
.dot,.actions i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;display:inline-block}

.note{margin-top:24px;padding:16px;border-radius:12px;border:1px dashed var(--line)}
.note p{line-height:1.45}
.note .row{display:flex;gap:20px;margin-top:8px}

.list{display:grid}
.card{padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.meta{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.meta span{margin-left:auto}
.pv{font-family:var(--serif);font-size:1.02rem;line-height:1.45;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:6px;font-size:.8rem;color:var(--muted)}
.day{font-size:.82rem;color:var(--muted);font-weight:600;margin:24px 0 0}
.empty{font-family:var(--serif);color:var(--muted);font-size:1.05rem;line-height:1.5;margin-top:28px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:14px -20px 0;padding:2px 20px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:.86rem;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sugg{margin-top:8px}
.activetag{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:.92rem}

input,textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;-webkit-appearance:none;appearance:none}
input[type=search]{margin-top:16px}
textarea{font-family:var(--serif);line-height:1.5;resize:vertical;field-sizing:content;min-height:4.5em}
.fld{display:block;margin-top:16px}
.fld>span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.fld[data-acc] textarea{border-left:3px solid var(--c)}
.emo{margin-top:18px}
[data-k-choice] .chip{padding:6px 11px}
.fld.ci{display:flex;align-items:center;gap:10px;margin-top:10px}
.fld.ci>span{flex:0 0 96px;margin:0;line-height:1.25}
.fld.ci .chips{flex:1;gap:5px}
.emo summary{font-size:.9rem;color:var(--muted);cursor:pointer;padding:6px 0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pair .chip{text-align:center}
.txt{font-family:var(--serif);font-size:1.08rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.btnrow{display:flex;gap:22px;margin-top:24px;flex-wrap:wrap}
.del{color:var(--love)}

.sheet{position:fixed;inset:0;z-index:40;display:none}
.sheet.open{display:block}
.sheet-back{position:absolute;inset:0;background:rgba(20,20,22,.34)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:calc(100dvh - env(safe-area-inset-top) - 28px);overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain;animation:up .22s ease-out}
.sheet-panel.full{top:0;max-height:none;border-radius:0;padding-top:calc(env(safe-area-inset-top) + 18px)}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-panel{animation:none}}
.sh-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sh-head h2{font-family:var(--serif);font-weight:400;font-size:1.5rem;line-height:1.2}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;padding:6px 12px calc(env(safe-area-inset-bottom) + 6px);background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabs button{flex:1;max-width:140px;padding:11px 0;font-size:.8rem;color:var(--muted);text-align:center}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}

.gate{max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 11vh) 24px 48px}
.mark{display:block;width:64px;height:56px;margin-bottom:22px}
.mark circle{mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){.mark circle{mix-blend-mode:screen}}
.gate h1{font-size:2.6rem}
.lede{font-family:var(--serif);font-size:1.15rem;line-height:1.5;color:var(--muted);margin:10px 0 26px}
.gate .fld{margin-top:14px}
.err{color:var(--love);margin-top:12px;font-size:.92rem;min-height:1.3em}

.mapview{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:calc(env(safe-area-inset-top) + 22px) 0 calc(env(safe-area-inset-bottom) + 58px)}
.mapview header{padding:0 20px}
.seg{display:flex;gap:6px;margin-top:12px}
.mapwrap{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.mapempty{position:absolute;inset:auto 20px 40%;text-align:center;font-family:var(--serif);font-size:1.05rem}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 20px;font-size:.78rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}

.player{text-align:center;padding:8px 0}
.player h2{font-family:var(--serif);font-weight:400;font-size:1.6rem;margin:6px 0 28px}
.pp{width:84px;height:84px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;margin:0 auto 28px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--practice);-webkit-appearance:auto;appearance:auto}
.times{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.prow{padding:12px 0;border-bottom:1px solid var(--line)}
.pname{font-family:var(--serif);font-size:1.05rem}
.pname small{display:block;font-family:var(--sans);font-size:.8rem;color:var(--muted);margin-top:2px}
.pbar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:8px;max-width:260px}
.pline{font-family:var(--serif);font-size:1.02rem;line-height:1.5;margin-top:10px}
.track{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.trk{flex:1;padding:14px 0;font-family:var(--serif);font-size:1.05rem}
.libbar{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.libbar input{flex:1 1 100%}
.grp{margin:18px 0 0;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.trk small{display:block;font-family:var(--sans);font-size:.8rem;color:var(--muted);margin-top:2px}

.set{margin-top:34px}
.set h2{font-family:var(--serif);font-weight:400;font-size:1.3rem;margin-bottom:4px}
.set textarea{font-family:var(--sans);font-size:16px;margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="root"></div>
<div id="sheet" class="sheet" aria-modal="true" role="dialog"><div class="sheet-back" data-act="close"></div><div class="sheet-panel"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-mp3" accept="audio/*,.mp3,.m4a" multiple hidden>
<input type="file" id="file-restore" hidden>
<script>
'use strict';
/* ---------- basics ---------- */
const ITER = 600000, DAY = 864e5, LOCK_AFTER = 5 * 60e3;
const enc = new TextEncoder(), dec = new TextDecoder();
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + crypto.getRandomValues(new Uint32Array(1))[0].toString(36);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const localInput = d => `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtDay = d => d.toLocaleDateString('en-AU', {weekday:'long', day:'numeric', month:'long', ...(d.getFullYear() !== new Date().getFullYear() ? {year:'numeric'} : {})});
const fmtTime = d => d.toLocaleTimeString('en-AU', {hour:'numeric', minute:'2-digit'});
const mmss = s => { s = Math.max(0, Math.round(s || 0)); return `${Math.floor(s/60)}:${pad(s%60)}`; };
const byDateDesc = (a, b) => b.date.localeCompare(a.date);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const normalizeTag = t => String(t).trim().toLowerCase().replace(/^#+/, '').replace(/\s+/g, '-').replace(/[^\p{L}\p{N}_-]/gu, '');
const parseTags = text => [...String(text).matchAll(/#([\p{L}\p{N}][\p{L}\p{N}_-]*)/gu)].map(m => m[1].toLowerCase());
const parseTagInput = text => [...new Set(String(text).split(/[\s,]+/).map(normalizeTag).filter(Boolean))];

/* ---------- entry types ---------- */
const TYPES = {
  laf:       {label:'LAF', title:"Tonight's LAF", color:'--love', soothe:'What helped today?', fields:[
               {k:'love', label:'What I love about myself today', accent:'love', rows:2, focus:true},
               {k:'accept', label:'What I accept about myself today', accent:'accept', rows:2},
               {k:'forgive', label:'What I forgive myself for today', accent:'forgive', rows:2},
               {k:'notice', label:'Anything else that came up', rows:2},
               {k:'energy', label:'Energy', kind:'choice', options:['Low','OK','Good']},
               {k:'focus', label:'Focus', kind:'choice', options:['Scattered','OK','Clear']},
               {k:'sleep', label:'Sleep', kind:'choice', options:['Poor','OK','Good']},
               {k:'sensory', label:'Sensory load', kind:'choice', options:['Calm','Busy','Overloaded']},
               {k:'social', label:'Social battery', kind:'choice', options:['Empty','OK','Full']}]},
  dream:     {label:'Dream', color:'--dream', intro:'Tap the mic on the keyboard to dictate.', fields:[
               {k:'text', label:'The dream', rows:7, focus:true}, {k:'title', label:'A title, if one comes', kind:'line'}]},
  note:      {label:'Noticing', color:'--forgive', soothe:'Anything help?', intro:'Whatever is here right now.', fields:[
               {k:'text', label:'What’s coming up', rows:5, focus:true}]},
  trigger:   {label:'Triggered', color:'--love', parts:true, soothe:'What I tried', sootheOpen:true, intro:'When something set you off. Short is fine.', fields:[
               {k:'text', label:'What happened', rows:3, focus:true},
               {k:'state', label:'Where it went', kind:'choice', options:['Meltdown','Shutdown','Held it together']},
               {k:'did', label:'What I did, or wanted to do', rows:2},
               {k:'adult', label:'What my Healthy Adult says', accent:'forgive', rows:3},
               {k:'need', label:'What I needed', rows:2},
               {k:'helpedHow', label:'Did it help?', kind:'choice', options:['Not really','A bit','A lot']}]},
  meditation:{label:'Meditation', color:'--practice', fields:[
               {k:'kind', label:'Kind', kind:'choice', options:['Recording','Silent','Lumenate']},
               {k:'track', label:'Practice', kind:'line'}, {k:'minutes', label:'Minutes', kind:'num'},
               {k:'text', label:'Reflection', rows:5, focus:true}]},
  yoga:      {label:'Yoga', color:'--practice', fields:[
               {k:'style', label:'Style', kind:'line', focus:true}, {k:'minutes', label:'Minutes', kind:'num'},
               {k:'text', label:'Notes', rows:4}]},
  idea:      {label:'Idea', color:'--creative', fields:[
               {k:'text', label:'Something I could make or try', rows:3, focus:true}]},
  creative:  {label:'Creative work', color:'--creative', fields:[
               {k:'what', label:'What I made or did', kind:'line', focus:true}, {k:'text', label:'Notes', rows:4}]},
  retreat:   {label:'Retreat', color:'--creative', fields:[
               {k:'focus', label:'Focus', kind:'choice', options:['Reflection','Creative','Both']},
               {k:'hours', label:'Hours', kind:'num'}, {k:'place', label:'Where', kind:'line'},
               {k:'text', label:'What came up', rows:9}]},
  review:    {label:'Weekly review', color:'--muted', fields:[
               {k:'text', label:'What keeps coming up?', rows:6, focus:true}]},
};
const TYPE_ORDER = ['laf','trigger','dream','note','meditation','yoga','idea','creative','retreat','review'];
// Everyday pairs shown on every entry (editable in Settings)
const DEFAULT_EMOTIONS = [['calm','agitated'],['safe','threatened'],['confident','insecure'],['peaceful','enraged'],['joyous','grieving'],['proud','ashamed'],['loving','hateful'],['fearless','frightened'],['satisfied','frustrated'],['grateful','ungrateful'],['vital','exhausted'],['trusting','suspicious']];
// Full iRest library, Level 1 and Level 2 manuals, de-duplicated. Searchable from Feelings.
const lib = s => s.split('|').map(p => p.split('/'));
const LIB_EMO = lib('ashamed/proud|assured/perplexed|bashful/unreserved|blissful/unhappy|boastful/modest|boisterous/mellow|bold/unreserved|bored/interested|brash/demure|bright/idiotic|calm/agitated|calm/nervous|calm/raging|cautious/unafraid|certain/undecided|charmed/horrified|cheerful/sad|closemouthed/gossipy|collected/confused|comfortable/pained|comforted/martyred|competitive/cooperative|complete/desirous|complete/incomplete|composed/hysterical|composed/worried|concentrating/inattentive|confident/embarrassed|confident/insecure|confident/scared|abandoned/safe|congenial/incompatible|accepting/shocked|conniving/straightforward|active/passive|contemptuous/tolerant|aggressive/passive|content/discontent|content/lonely|agonized/peaceful|contented/bothered|alert/numb|contentious/empathic|amused/displeased|contracted/open|angelic/fiendish|angry/tolerant|cowardly/noble|animated/hung-over|cranky/easy-going|anxious/unafraid|creative/unproductive|apathetic/responsive|deep/shallow|apologetic/remorseless|deep/superficial|apprehensive/secure|defensive/undefended|approving/disapproving|deficient/full|arrogant/humble|delighted/disgusted|delighted/heavy-hearted|frightened/fearless|frustrated/satisfied|dependent/independent|depressed/happy|full/empty|derogatory/prideful|generous/greedy|generous/resentful|despairing/lighthearted|good-tempered/surly|despondent/lighthearted|determined/uncertain|grateful/ungrateful|disappointed/pleased|gratified/hurt|disbelieving/trusting|grieving/joyous|guilty/innocent|discouraged/optimistic|hard/soft|disidentified/identified|hateful/loving|disquiet/quiet|healthy/sick|dissatisfied/satisfied|distant/intimate|helpful/uncooperative|distasteful/satisfying|helpless/powerful|domineering/meek|helpless/self-reliant|earthly/transcended|hopeful/hopeless|easygoing/prudish|egotistical/humble|hostile/sympathetic|empathic/indifferent|humble/modest|energetic/lazy|energetic/tired|enraged/peaceful|enthusiastic/listless|envious/unselfish|ignorant/knowledgeable|exasperated/placid|important/insignificant|exhausted/vital|impoverished/rich|fair/prejudiced|false/truthful|flexible/obstinate|forgetful/thoughtful|forlorn/optimistic|forthright/scheming|forward/sheepish|forward/withdrawn|interested/uninterested|intolerant/thoughtful|positive/negative|invincible/vulnerable|potent/sterile|jealous/trusting|kind/surly|present/lacking|knowing/surprised|pressured/relaxed|puzzled/understanding|lighthearted/melancholy|reactive/responsive|regretful/remorseless|lustful/spiritual|meditative/unthinking|repelled/tempted|repellent/seductive|mischievous/thoughtful|miserable/satisfied|rested/overworked|nauseated/well|neglected/nourished|safe/threatened|nonchalant/perturbed|separate/unified|paranoid/sound|simple/sophisticated|skeptical/trusting|penetrable/vulnerable|smug/humble|spirited/sulky|two-faced/straightforward|unafraid/timid|strong/weak|uncommunicative/talkative|suspicious/trusting|talkative/aloof|tender/violent|vexed/contented|empathetic/indifferent|flexible/rigid|happy/sad|potent/impotent|sensitive/numb|unreserved/shy|vulnerable/invulnerable');
const LIB_BODY = lib('faint/strong|floating/sinking|hard/soft|heavy/light|hot/cold|lethargic/alert|loose/tight|moist/dry|nauseous/well|nervous/calm|numb/sensitive|painful/pleasurable|queasy/steady|quiet/throbbing|relaxed/tense|restricted/spacious|rough/smooth|sharp/dull|sleepy/alert|spacious/claustrophobic|stable/unstable|strong/weak|superficial/deep|thick/thin|at-ease/uneasy|burning/cooling|uncomfortable/comfortable|coarse/smooth|warm/cool|well/sick|constricted/spacious|wet/dry|lethargic/awake|prickly/soft');
const LIB = [...LIB_EMO.map(p => ({p, kind:'emotion'})), ...LIB_BODY.map(p => ({p, kind:'body'}))];
const LIB_WORDS = new Set([...LIB_EMO.flat(), ...LIB_BODY.flat()]);
const SEED_TAGS = ['self','people','work','body','creativity','nature','anger','fear','joy'];

/* ---------- storage (IndexedDB) ---------- */
let _db;
function db() {
  return _db ||= new Promise((res, rej) => {
    const r = indexedDB.open('laf-journal', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('audio'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idb(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(store, mode); let out;
    const req = fn(tx.objectStore(store)); if (req) req.onsuccess = () => { out = req.result; };
    tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}

  'restore-start'() { suspendLock(); $('#file-restore').click(); },
  async 'restore-go'() {
    const top = STACK.at(-1), data = top.data, b = $('[data-act=restore-go]');
    b.disabled = true; b.textContent = 'Opening…';
    try {
      const salt = unb64(data.salt), key = await deriveKey($('#rpass').value, salt, data.iter);
      const st = migrate(JSON.parse(dec.decode(await unseal(key, unb64(data.iv), unb64(data.ct)))));
      if (KEY && !confirm('Replace everything in this journal with this backup?')) { b.disabled = false; b.textContent = 'Restore'; return; }
      const same = META && b64(META.salt) === data.salt, had = st.tracks.length;
      META = {salt, iter:data.iter}; await put('kv', 'meta', META);
      if (!same) { await clearStore('audio'); st.tracks = []; }
      KEY = key; S = st; await persist();
      closeAllSheets(); VIEW = 'today'; enterApp();
      toast(!same && had ? 'Backup restored. Add your MP3s again.' : 'Backup restored', 4000);
    } catch { $('#rerr').textContent = 'That passphrase didn’t open this backup.'; b.disabled = false; b.textContent = 'Restore'; }
  },
  tab: el => showView(el.dataset.v),
  new: el => openForm(el.dataset.type),
  meditate: () => pushSheet(meditateObj()),
  sit: () => { popSheet(); openForm('meditation', null, {kind:'Silent'}); },
  lumenate: () => { popSheet(); openForm('meditation', null, {kind:'Lumenate', track:'Lumenate'}); },
  summary: () => pushSheet(summaryObj()),
  'sum-days': el => { SUM.name = $('#sum-name').value; SUM.days = +el.dataset.d; drawSheet(); },
  'sum-type': el => { SUM.name = $('#sum-name').value; const t = el.dataset.t; SUM.types.has(t) ? SUM.types.delete(t) : SUM.types.add(t); drawSheet(); },
  'sum-text': el => { SUM.name = $('#sum-name').value; SUM.text = el.dataset.v === '1'; drawSheet(); },
  'sum-make': () => exportSummary(),
  'help-add': () => {
    const inp = $('#help-new'), v = inp.value.trim(); if (!v) return;
    if (!S.settings.helps.includes(v)) { S.settings.helps.push(v); persist(); }
    const box = $('.helps .chips'), have = $$('.chip', box).find(b => b.dataset.h === v);
    if (have) have.classList.add('on'); else box.insertAdjacentHTML('beforeend', `<button type="button" class="chip on" data-act="emo" data-h="${esc(v)}">${esc(v)}</button>`);
    inp.value = '';
  },
  'lib-sort': el => { LIB_UI.sort = el.dataset.s; drawSheet(); },
  'track-edit': el => pushSheet(trackEditObj(el.dataset.id)),
  async 'track-save'(el) {
    const t = S.tracks.find(x => x.id === el.dataset.id); if (!t) return;
    const name = $('#tr-name').value.trim(), group = $('#tr-group').value.trim();
    if (!name) { toast('Give it a name.'); return; }
    if (name !== t.name) for (const e of S.entries) if (e.type === 'meditation' && (e.trackId === t.id || (!e.trackId && e.fields.track === t.name))) { e.trackId = t.id; e.fields.track = name; }
    t.name = name; t.group = group; await persist(); popSheet(); toast('Saved');
  },
  ideas: () => { JF.type = 'idea'; JF.tag = null; JF.q = ''; showView('journal'); },
  view: el => pushSheet(viewObj(el.dataset.id)),
  edit: el => { const e = byId(el.dataset.id); if (e) replaceSheet(formObj({type:e.type, entry:e})); },
  async del(el) {
    if (!confirm('Delete this entry? This can’t be undone.')) return;
    S.entries = S.entries.filter(e => e.id !== el.dataset.id); await persist();
    popSheet(); renderView(); if (STACK.length) drawSheet(); toast('Deleted');
  },
  'idea-done': el => {
    const idea = byId(el.dataset.id); if (!idea) return;
    replaceSheet(formObj({type:'creative', prefill:{what:idea.fields.text, tags:idea.tags},
      afterSave: () => { idea.fields.done = true; persist(); renderView(); }}));
  },
  close: () => popSheet(),
  'save-form': () => saveForm(false),
  emo: el => el.classList.toggle('on'),
  'emo-add': el => {
    const w = el.dataset.tag, p = $('.sheet-panel');
    const have = $$('.emo .core .chip, .emo .extra .chip', p).find(b => b.dataset.tag === w);
    if (have) have.classList.add('on');
    else $('.emo .extra', p).insertAdjacentHTML('beforeend', `<button type="button" class="chip on" data-act="emo" data-tag="${esc(w)}">${esc(w)}</button>`);
    el.classList.add('on'); toast(`Added ${w}`, 1200);
  },
  choice: el => $$('button', el.parentNode).forEach(b => b.classList.toggle('on', b === el && !b.classList.contains('on'))),
  sugg: el => {
    const inp = $('#ftags'), cur = parseTagInput(inp.value), t = el.dataset.tag, i = cur.indexOf(t);
    if (i >= 0) cur.splice(i, 1); else cur.push(t);
    inp.value = cur.map(x => '#' + x).join(' '); el.classList.toggle('on', i < 0);
  },
  jtype: el => { JF.type = el.dataset.t; renderView(); },
  'jtag-clear': () => { JF.tag = null; renderView(); },
  'tag-journal': el => { JF.type = 'all'; JF.tag = el.dataset.tag; JF.q = ''; closeAllSheets(); showView('journal'); },
  'map-select': el => openTag(el.dataset.tag),
  period: el => { MAPP = +el.dataset.d; renderView(); },
  backup: () => exportBackup(),
  'nudge-ok': async () => { S.settings.nudgeSeen = new Date().toISOString(); await persist(); renderView(); },
  'add-mp3': () => { suspendLock(); $('#file-mp3').click(); },
  play: el => playTrack(el.dataset.id),
  async 'track-del'(el) {
    const t = S.tracks.find(x => x.id === el.dataset.id);
    if (!t || !confirm(`Remove “${t.name}”? Logged sessions stay in the journal.`)) return;
    await del('audio', t.id); S.tracks = S.tracks.filter(x => x !== t); await persist();
    if (STACK.at(-1)?.kind === 'track-edit') popSheet(); else drawSheet();
  },
  pp: () => { if (!player) return; player.audio.paused ? player.audio.play() : player.audio.pause(); },
  finish: () => finishPlayer(false),
  lock: () => lock(),
  async 'save-emo'() {
    const pairs = $('#emo-edit').value.split('\n')
      .map(l => l.split(/\s*\/\s*|\s+[-–—]\s+|\s*,\s*/).map(normalizeTag).filter(Boolean).slice(0, 2)).filter(p => p.length);
    if (!pairs.length) { toast('Add at least one pair, like: confident / insecure'); return; }
    S.settings.emotions = pairs; S.settings.emoCustom = true; await persist(); toast('Feelings saved');
  },
  async 'emo-reset'() { S.settings.emotions = DEFAULT_EMOTIONS; S.settings.emoCustom = false; await persist(); renderView(); toast('Suggested pairs restored'); },
  async 'save-helps'() { S.settings.helps = $('#help-edit').value.split('\n').map(x => x.trim()).filter(Boolean); await persist(); toast('Saved'); },
  async 'save-sch'() { S.settings.schemas = $('#sch-edit').value.split('\n').map(x => x.trim()).filter(Boolean); await persist(); toast('Schemas saved'); },
  async 'save-seed'() { S.settings.seedTags = parseTagInput($('#seed-edit').value); await persist(); toast('Tags saved'); },
  async erase() {
    if (prompt('This deletes every entry and recording on this phone. Type ERASE to confirm.') !== 'ERASE') return;
    stopPlayer(); closeAllSheets(); await clearStore('kv'); await clearStore('audio');
    KEY = null; S = null; META = null; renderSetup(); toast('Journal erased');
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape' && STACK.length) popSheet();
});

/* ---------- file inputs ---------- */
$('#file-mp3').addEventListener('change', async ev => {
  const files = [...ev.target.files]; ev.target.value = '';
  if (!files.length || !KEY) return;
  let i = 0;
  for (const f of files) {
    i++; toast(`Adding ${i} of ${files.length}…`, 60000);
    try {
      const dur = await audioDuration(f), {iv, ct} = await seal(KEY, await f.arrayBuffer()), id = uid();
      await put('audio', id, {iv, ct, type: f.type || 'audio/mpeg'});
      S.tracks.push({id, name: f.name.replace(/\.[^.]+$/, ''), dur, added: new Date().toISOString()});
      await persist();
    } catch (err) { toast(`Couldn’t add ${f.name}: ${err.message}`); await sleep(2500); }
  }
  toast(files.length === 1 ? 'Recording added' : 'Recordings added');
  lastActive = Date.now();
  if (STACK.at(-1)?.kind === 'meditate') drawSheet();
});
$('#file-restore').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); if (data.app !== 'laf-journal' || !data.ct) throw 0; }
  catch { toast('That file isn’t a LAF backup.'); return; }
  const o = restoreObj(data); o.data = data; pushSheet(o);
});

/* ---------- start ---------- */
(async function boot() {
  try { await navigator.storage?.persist?.(); } catch {}
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!window.crypto?.subtle || !window.indexedDB) { $('#root').innerHTML = '<main class="gate"><h1>LAF</h1><p class="lede">This browser can’t run the journal securely. Open it in Safari.</p></main>'; return; }
  META = await get('kv', 'meta');
  if (META) renderUnlock(); else renderSetup();
})();
</script>
</body>
